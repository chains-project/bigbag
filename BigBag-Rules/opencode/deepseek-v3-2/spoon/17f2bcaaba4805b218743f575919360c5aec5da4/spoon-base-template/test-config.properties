# Example configuration file for the Spoon transformation
# Format:
# ruleN.targetClass = fully.qualified.ClassName
# ruleN.method = methodName
# ruleN.configClass = fully.qualified.ConfigClassName
# ruleN.paramX.setter = setterMethodName

# Rule for KDTree.create(int)
rule1.targetClass=org.tinspin.index.kdtree.KDTree
rule1.method=create
rule1.configClass=org.tinspin.index.IndexConfig
rule1.param0.setter=setDimensions

# Rule for CoverTree.create(int, double, PointDistanceFunction)
rule2.targetClass=org.tinspin.index.covertree.CoverTree
rule2.method=create
rule2.configClass=org.tinspin.index.IndexConfig
rule2.param0.setter=setDimensions
# Note: Parameters 1 and 2 would need custom handling
# rule2.param1.setter=setBase
# rule2.param2.setter=setDistanceFunction